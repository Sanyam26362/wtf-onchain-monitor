services:
  postgres:
    image: postgres:16-alpine
    container_name: wtf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wtf_user
      POSTGRES_PASSWORD: wtf_password
      POSTGRES_DB: wtf_indexer
    ports:
      - "5433:5432"
    volumes:
      - wtf_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wtf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  wtf_pgdata:
