openapi: 3.0.3
info:
  title: WTF On-Chain Monitoring REST API
  description: >
    Production REST API layer exposing indexed Sepolia on-chain payroll, generic ERC-20 token transfers,
    transactions, and reconciliation exceptions to the Next.js monitoring dashboard.
  version: 1.0.0
  contact:
    name: WTF Engineering Team
servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /health:
    get:
      summary: Liveness Probe
      description: Returns immediate HTTP 200 without querying PostgreSQL or external RPC services.
      operationId: getHealth
      tags:
        - System
      responses:
        '200':
          description: Service is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      timestamp:
                        type: string
                        format: date-time
                        example: '2026-09-16T10:00:00Z'

  /ready:
    get:
      summary: Readiness Probe
      description: Verifies database connectivity and essential runtime configurations.
      operationId: getReady
      tags:
        - System
      responses:
        '200':
          description: Service is fully ready to handle incoming queries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ready
                      database:
                        type: string
                        example: connected
                      chain_id:
                        type: integer
                        example: 11155111
                      environment:
                        type: string
                        example: development
                      payroll_contract:
                        type: string
                        example: '0x1818B0F20cb9F4b0559eE94155B7B12C20CEFEdf'
                      generic_token_contract:
                        type: string
                        example: '0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238'
        '503':
          description: Database or required runtime components are not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sync/status:
    get:
      summary: Indexer Sync Status
      description: Returns high-level block synchronization progress, stream lags, and checkpoint statuses.
      operationId: getSyncStatus
      tags:
        - Sync
      responses:
        '200':
          description: Current synchronization status across indexer streams.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SyncStatusResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sync/backfill:
    post:
      summary: Operator Historical Backfill Trigger
      description: Operator route to initiate or schedule bounded historical indexing for specified block ranges.
      operationId: postSyncBackfill
      tags:
        - Sync
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackfillRequest'
      responses:
        '202':
          description: Backfill job successfully accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: accepted
                      stream_id:
                        type: string
                        example: erc20_transfers
                      from_block:
                        type: integer
                        example: 11714400
                      to_block:
                        type: integer
                        example: 11714450
                      chain_id:
                        type: integer
                        example: 11155111
                      message:
                        type: string
                        example: Backfill scheduled for blocks 11714400 to 11714450
        '400':
          description: Invalid block range or malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid operator authorization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/transactions/{hash}:
    get:
      summary: Transaction Details & Decoded Events
      description: Retrieves transaction status, dynamic confirmation depth, decoded events, and network-correct block explorer link.
      operationId: getTransactionByHash
      tags:
        - Transactions
      parameters:
        - name: hash
          in: path
          required: true
          description: 32-byte Ethereum transaction hash with 0x prefix (66 characters)
          schema:
            type: string
            example: '0x5c4217158bcbe61fe60f852f8623ad9beee4ce2cd1032df4fb3c9c991316b1ff'
      responses:
        '200':
          description: Transaction retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Invalid transaction hash format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Transaction not found in indexed records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/employers/{address}:
    get:
      summary: Employer Profile & Associated Employees
      description: Retrieves employer funds, salary rates, and list of enrolled employees. Note that financial payroll runway projections remain null.
      operationId: getEmployerByAddress
      tags:
        - Payroll
      parameters:
        - name: address
          in: path
          required: true
          description: 20-byte Ethereum address with 0x prefix (42 characters)
          schema:
            type: string
            example: '0x1818B0F20cb9F4b0559eE94155B7B12C20CEFEdf'
      responses:
        '200':
          description: Employer retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EmployerResponse'
        '400':
          description: Invalid Ethereum address format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Employer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/employees/{address}:
    get:
      summary: Employee Profile & History
      description: Retrieves employee salary per second, leave balances, recent funding history, and claim history.
      operationId: getEmployeeByAddress
      tags:
        - Payroll
      parameters:
        - name: address
          in: path
          required: true
          description: 20-byte Ethereum address with 0x prefix (42 characters)
          schema:
            type: string
            example: '0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC'
      responses:
        '200':
          description: Employee retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Invalid Ethereum address format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Employee not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/payroll/fundings:
    get:
      summary: List Payroll Funding Events
      description: Filterable and paginated list of employer payroll funding deposits.
      operationId: listPayrollFundings
      tags:
        - Payroll
      parameters:
        - name: employer
          in: query
          description: Filter by employer wallet address
          schema:
            type: string
        - name: employee
          in: query
          description: Filter by employee wallet address
          schema:
            type: string
        - name: from_block
          in: query
          description: Minimum block number
          schema:
            type: integer
        - name: to_block
          in: query
          description: Maximum block number
          schema:
            type: integer
        - name: from_date
          in: query
          description: Minimum timestamp in ISO8601/RFC3339 format
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          description: Maximum timestamp in ISO8601/RFC3339 format
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          description: Page number (1-indexed, default 1)
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: Page size (default 20, max 100)
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          description: Whitelisted sort field (block_number, block_timestamp, amount_paid, amount_credited)
          schema:
            type: string
            default: block_number
        - name: order
          in: query
          description: Sort direction (asc or desc)
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of payroll fundings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingListEnvelope'
        '400':
          description: Invalid filter parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/payroll/claims:
    get:
      summary: List Salary Claim Events
      description: Filterable and paginated list of employee salary withdrawals.
      operationId: listSalaryClaims
      tags:
        - Payroll
      parameters:
        - name: employee
          in: query
          description: Filter by employee wallet address
          schema:
            type: string
        - name: from_block
          in: query
          description: Minimum block number
          schema:
            type: integer
        - name: to_block
          in: query
          description: Maximum block number
          schema:
            type: integer
        - name: from_date
          in: query
          description: Minimum timestamp in ISO8601/RFC3339 format
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          description: Maximum timestamp in ISO8601/RFC3339 format
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          description: Page number (1-indexed, default 1)
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: Page size (default 20, max 100)
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          description: Whitelisted sort field (block_number, block_timestamp, amount)
          schema:
            type: string
            default: block_number
        - name: order
          in: query
          description: Sort direction (asc or desc)
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of salary claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimListEnvelope'
        '400':
          description: Invalid filter parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/tokens/{address}/transfers:
    get:
      summary: List ERC-20 Token Transfers
      description: Filterable and paginated list of token transfers for any generic ERC-20 token contract.
      operationId: listTokenTransfers
      tags:
        - Tokens
      parameters:
        - name: address
          in: path
          required: true
          description: ERC-20 token contract address
          schema:
            type: string
            example: '0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238'
        - name: wallet
          in: query
          description: Filter by participant wallet address
          schema:
            type: string
        - name: direction
          in: query
          description: Direction relative to wallet (in, out, or all)
          schema:
            type: string
            enum: [in, out, all]
            default: all
        - name: from_block
          in: query
          description: Minimum block number
          schema:
            type: integer
        - name: to_block
          in: query
          description: Maximum block number
          schema:
            type: integer
        - name: from_date
          in: query
          description: Minimum timestamp in ISO8601/RFC3339 format
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          description: Maximum timestamp in ISO8601/RFC3339 format
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          description: Page number (1-indexed, default 1)
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: Page size (default 20, max 100)
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          description: Whitelisted sort field (block_number, block_timestamp, amount)
          schema:
            type: string
            default: block_number
        - name: order
          in: query
          description: Sort direction (asc or desc)
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of ERC-20 token transfers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferListEnvelope'
        '400':
          description: Invalid filter parameters or direction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/reconciliation/exceptions:
    get:
      summary: List Reconciliation Exceptions
      description: Filterable and paginated list of on-chain / database balance or event reconciliation discrepancies.
      operationId: listReconciliationExceptions
      tags:
        - Reconciliation
      parameters:
        - name: severity
          in: query
          description: Filter by exception severity
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [open, resolved]
        - name: type
          in: query
          description: Filter by exception classification type
          schema:
            type: string
        - name: from_date
          in: query
          description: Minimum detection timestamp
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          description: Maximum detection timestamp
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          description: Page number (1-indexed, default 1)
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: Page size (default 20, max 100)
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          description: Whitelisted sort field (detected_at, severity, status)
          schema:
            type: string
            default: detected_at
        - name: order
          in: query
          description: Sort direction (asc or desc)
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of reconciliation exceptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionListEnvelope'
        '400':
          description: Invalid filter parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer token matching OPERATOR_API_KEY
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key matching OPERATOR_API_KEY

  schemas:
    PaginationMeta:
      type: object
      required:
        - page
        - page_size
        - total
        - has_next
      properties:
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total:
          type: integer
          format: int64
          example: 45
        has_next:
          type: boolean
          example: true

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INVALID_ADDRESS
        message:
          type: string
          example: address must be 42 characters long

    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    BackfillRequest:
      type: object
      required:
        - from_block
        - to_block
      properties:
        from_block:
          type: integer
          example: 11714400
        to_block:
          type: integer
          example: 11714450
        stream_id:
          type: string
          example: erc20_transfers

    StreamStatus:
      type: object
      required:
        - stream_id
        - last_indexed_block
        - lag
        - status
      properties:
        stream_id:
          type: string
          example: erc20_transfers
        token:
          type: string
          nullable: true
          example: '0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238'
        last_indexed_block:
          type: integer
          example: 11714490
        lag:
          type: integer
          format: int64
          example: 0
        status:
          type: string
          example: synced

    SyncStatusResponse:
      type: object
      required:
        - chain_id
        - latest_block
        - safe_block
        - streams
      properties:
        chain_id:
          type: integer
          example: 11155111
        latest_block:
          type: integer
          example: 11714490
        safe_block:
          type: integer
          example: 11714426
        streams:
          type: array
          items:
            $ref: '#/components/schemas/StreamStatus'
        last_error:
          type: string
          nullable: true
          example: null

    TransactionEvent:
      type: object
      required:
        - event_name
        - contract_address
        - log_index
      properties:
        event_name:
          type: string
          example: Transfer
        contract_address:
          type: string
          example: '0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238'
        log_index:
          type: integer
          example: 12
        data:
          type: object

    TransactionResponse:
      type: object
      required:
        - hash
        - chain_id
        - sender
        - status
        - confirmations
        - events
        - explorer_url
        - first_seen_at
      properties:
        hash:
          type: string
          example: '0x5c4217158bcbe61fe60f852f8623ad9beee4ce2cd1032df4fb3c9c991316b1ff'
        chain_id:
          type: integer
          example: 11155111
        sender:
          type: string
          example: '0x435c7541B150A288599aA5dbeB7B54c5991d1694'
        recipient:
          type: string
          nullable: true
          example: '0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238'
        status:
          type: string
          example: confirmed
        block_number:
          type: integer
          nullable: true
          example: 11714472
        confirmations:
          type: integer
          example: 19
        gas_used:
          type: string
          nullable: true
          example: '45000'
        events:
          type: array
          items:
            $ref: '#/components/schemas/TransactionEvent'
        explorer_url:
          type: string
          example: 'https://sepolia.etherscan.io/tx/0x5c4217158bcbe61fe60f852f8623ad9beee4ce2cd1032df4fb3c9c991316b1ff'
        error_data:
          type: object
          nullable: true
        first_seen_at:
          type: string
          format: date-time
          example: '2026-09-16T10:00:00Z'

    EmployeeSummary:
      type: object
      required:
        - address
        - salary_per_second
        - active
      properties:
        address:
          type: string
          example: '0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC'
        salary_per_second:
          type: string
          example: '1000000000000'
        active:
          type: boolean
          example: true

    EmployerResponse:
      type: object
      required:
        - address
        - active
        - funds
        - total_salary_per_second
        - employees
        - payroll_balance_projection
      properties:
        address:
          type: string
          example: '0x1818B0F20cb9F4b0559eE94155B7B12C20CEFEdf'
        active:
          type: boolean
          example: true
        funds:
          type: string
          example: '500000000000000000000'
        total_salary_per_second:
          type: string
          example: '2000000000000'
        added_at:
          type: string
          format: date-time
          nullable: true
        removed_at:
          type: string
          format: date-time
          nullable: true
        latest_tx_hash:
          type: string
          nullable: true
        employees:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeSummary'
        payroll_balance_projection:
          type: string
          nullable: true
          example: null
          description: Explicitly null because off-chain token reserve projections cannot be determined solely from on-chain event logs.
        runway_inputs:
          type: object

    EmployeeResponse:
      type: object
      required:
        - address
        - employer
        - salary_per_second
        - active
        - total_leaves
        - funding_history
        - claim_history
      properties:
        address:
          type: string
          example: '0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC'
        employer:
          type: string
          example: '0x1818B0F20cb9F4b0559eE94155B7B12C20CEFEdf'
        salary_per_second:
          type: string
          example: '1000000000000'
        last_withdraw:
          type: integer
          nullable: true
        active:
          type: boolean
          example: true
        total_leaves:
          type: string
          example: '0'
        allocation:
          type: string
          nullable: true
        added_at:
          type: string
          format: date-time
          nullable: true
        removed_at:
          type: string
          format: date-time
          nullable: true
        latest_tx_hash:
          type: string
          nullable: true
        funding_history:
          type: array
          items:
            $ref: '#/components/schemas/PayrollFunding'
        claim_history:
          type: array
          items:
            $ref: '#/components/schemas/SalaryClaim'

    PayrollFunding:
      type: object
      required:
        - id
        - employer
        - employee
        - amount_paid
        - fee
        - amount_credited
        - tx_hash
        - block_number
        - block_timestamp
        - log_index
        - chain_id
      properties:
        id:
          type: integer
          format: int64
        employer:
          type: string
        employee:
          type: string
        amount_paid:
          type: string
        fee:
          type: string
        amount_credited:
          type: string
        tx_hash:
          type: string
        block_number:
          type: integer
        block_timestamp:
          type: string
          format: date-time
        log_index:
          type: integer
        chain_id:
          type: integer

    SalaryClaim:
      type: object
      required:
        - id
        - employee
        - amount
        - tx_hash
        - block_number
        - block_timestamp
        - log_index
        - chain_id
      properties:
        id:
          type: integer
          format: int64
        employee:
          type: string
        amount:
          type: string
        tx_hash:
          type: string
        block_number:
          type: integer
        block_timestamp:
          type: string
          format: date-time
        log_index:
          type: integer
        chain_id:
          type: integer

    TokenTransfer:
      type: object
      required:
        - id
        - chain_id
        - token
        - from_address
        - to_address
        - amount
        - tx_hash
        - block_number
        - block_timestamp
        - log_index
        - removed
        - created_at
      properties:
        id:
          type: integer
          format: int64
        chain_id:
          type: integer
        token:
          type: string
        from_address:
          type: string
        to_address:
          type: string
        amount:
          type: string
        tx_hash:
          type: string
        block_number:
          type: integer
        block_timestamp:
          type: string
          format: date-time
        log_index:
          type: integer
        removed:
          type: boolean
        created_at:
          type: string
          format: date-time

    ReconciliationException:
      type: object
      required:
        - id
        - type
        - severity
        - entity_ref
        - expected
        - observed
        - status
        - detected_at
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        entity_ref:
          type: string
        expected:
          type: object
        observed:
          type: object
        status:
          type: string
          enum: [open, resolved]
        detected_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true

    FundingListEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PayrollFunding'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
